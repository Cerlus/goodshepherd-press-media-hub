name: Deploy press hub to GitHub Pages
# Copy this press-site folder to the root of a public repo (suggested: goodshepherd-press-media-hub).
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package press kit
        run: |
          rm -f assets/press-kit/goodshepherd-press-kit.zip
          zip -r -q assets/press-kit/goodshepherd-press-kit.zip assets/branding assets/cards assets/screenshots assets/fonts/*OFL.txt FACT_SHEET.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
